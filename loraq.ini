# Keep the [radio] section identical on the transmitter and every receiver.

[radio]
# The settings here are used by LoRaQ-config=writer.py to initialize the radio module. 
# They are also used to calculate timing for bursts and acknowledgments, duty cycle and dwell time,
# and should be identical across all transmitters and receivers.
# Generally keep the defaults but set your own unique key, which must match across all devices.
baud_rate = 115200
channel = 18
power = 14
network_id = 42
key = 54321
spreading_factor = 7
bandwidth_khz = 125
coding_rate = 1
preamble_symbols = 8
max_frame_bytes = 200

[link]
# Per-device serial connection. interface: usb (USB dongle), hat (Pi GPIO header) or auto.
interface = auto
# Explicit device, e.g. /dev/serial0, /dev/ttyUSB0 or COM4. Blank = auto-detect.
port = 


[station]
# Required on every device, including headless transmitters.
# Use a unique ID (1-16 letters, digits, _ or -) and ACK slot (0-31).
station_id = Control_booth
ack_slot = 0
# Write a detailed diagnostic log next to this file: loraq-transmitter.log on a transmitter,
# loraq-display.log on a receiver (rotating, a few MB at most). Leave off normally; turn on to investigate problems.
diagnostic_log = false

[transmitter]
# Play alert sounds received from another transmitter, not locally sent cues.
audio_enabled = true
# OSC receiver settings
osc_ip = 127.0.0.1
osc_port = 53070
# Two redundant copies after the original = three total bursts (maximum eight retries).
retries = 2
# Duty cycle limit as a percentage of total airtime - for indication in the tranmitter preview window
duty_cycle_limit_percent = 1.0
# Maximum airtime per transmitted frame in milliseconds (0 disables) - for indication in the tranmitter preview window
max_dwell_time = 0
# Initial preview size in pixels; the stats panel is added below the preview height.
preview_width = 640
preview_height = 360
# OSC commands relayed over LoRa are sent here once armed with /oscstandby. Blank = disabled.
osc_forward_ip = 127.0.0.1
osc_forward_port = 53000

[receiver]
# Set false for silent receivers.
audio_enabled = true
# Show the last received TX ID and RSSI in a persistent top bar on the receiver display.
show_tx_info = false

# List here the remote stations to monitor in the preview window, using their [station] ID and slot.
# Also include other transmitters but do not include this transmitter's own preview as a remote station.
[expected_stations]
Control_booth = 0
Aux_controller = 1

# Optional per-device web display push settings; usable by transmitters and receivers.
# See docs/web_push.md.
[web_push]
# Any transmitter or receiver can push; duplicates from several pushers are merged by the server.
enabled = false
# Base URL of the uploaded web folder, e.g. https://example.com/loraq
url = https://example.com/loraq/
# This device's push token from the server's app/config.php (16-128 letters, digits, _ or -).
token = token_01234567890
# Transmitters only: also push cues heard over LoRa from other transmitters.
push_remote = true
# HTTP timeout in seconds, outbox size while offline, and idle heartbeat interval in seconds.
timeout_s = 5
max_queue = 10
heartbeat_s = 30
